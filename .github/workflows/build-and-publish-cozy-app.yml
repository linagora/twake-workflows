name: Build and publish Cozy app

on:
  workflow_call:
    inputs:
      mattermost-channel:
        description: MATTERMOST_CHANNEL, only read by apps publishing with --postpublish mattermost
        type: string
        default: ''
    secrets:
      REGISTRY_TOKEN:
        description: Registry editor token
      DOWNCLOUD_SSH_KEY:
        description: SSH key used by the downcloud prepublish hook
      MATTERMOST_HOOK_URL:
        description: Only for apps publishing with --postpublish mattermost

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # github.workflow is the caller's name here; the suffix keeps this group distinct from a caller's own group
    concurrency:
      group: ${{ github.workflow }}-cozy-app-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Audit production dependencies
        run: yarn npm audit --recursive --severity critical --environment production
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
      - name: BundleMon
        if: hashFiles('.bundlemonrc') != ''
        uses: lironer/bundlemon-action@4b47df0793e18e3899eeb07f19b7c88c92c2490e # v1
        continue-on-error: true
      - name: Set SSH for downcloud
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DOWNCLOUD_SSH_KEY }}
      - name: Publish
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')
        run: yarn run cozyPublish --yes
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          MATTERMOST_HOOK_URL: ${{ secrets.MATTERMOST_HOOK_URL }}
          MATTERMOST_CHANNEL: ${{ inputs.mattermost-channel }}
